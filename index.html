<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a2b4e">
  <title>منصة سعد بن أبي وقاص | الأنشطة والمنشورات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    :root { --primary: #0a2b4e; --gold: #d4af37; --bg-light: #f4f7fc; }
    body { background: var(--bg-light); color: #1e2f3e; }
    body.dark { background: #0f1725; color: #e2e8f0; }
    body.dark .card, body.dark .glass-card, body.dark .post-card { background: #1a253c !important; }
    .header-gold { background: linear-gradient(135deg, var(--primary), #071a2c); border-bottom: 3px solid var(--gold); position: sticky; top:0; z-index:1000; }
    .school-logo { width: 55px; height:55px; border-radius:50%; border:2px solid var(--gold); background:white; object-fit: cover; }
    .ticker-container { background: #0a1f33; color:white; padding:6px 0; white-space: nowrap; overflow: hidden; }
    .ticker-track { display: inline-block; animation: ticker 30s linear infinite; }
    .ticker-item { display: inline-block; padding:0 30px; }
    .ticker-item i { margin-left: 8px; color: var(--gold); }
    @keyframes ticker { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }
    .glass-card { background: white; border-radius: 24px; padding:20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom:20px; }
    .nav-btn { width:100%; background:none; border:none; text-align:right; padding:12px 15px; border-radius:16px; font-weight:700; transition:0.2s; border-right:4px solid var(--gold); margin-bottom:8px; }
    .nav-btn:hover, .nav-btn.active { background: var(--primary); color:white; transform: translateX(-5px); }
    .post-card { background: white; border-radius: 20px; padding:20px; margin-bottom:25px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.2s; }
    .post-avatar img, .post-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: var(--gold); display: flex; align-items: center; justify-content: center; color: white; }
    .media-wrapper { margin: 12px 0; border-radius: 16px; overflow: hidden; }
    .media-wrapper img, .media-wrapper video, .media-wrapper iframe { width: 100%; max-height: 320px; object-fit: cover; border-radius: 12px; }
    .btn-gold { background: linear-gradient(135deg, var(--gold), #b8860b); color: var(--primary); font-weight:800; border:none; padding:6px 18px; border-radius:40px; transition:0.2s; }
    .fab-th, .fab-st { position:fixed; bottom:30px; left:20px; background: var(--gold); color: var(--primary); border:none; width:48px; height:48px; border-radius:50%; z-index:900; cursor:pointer; }
    .fab-st { left:85px; background: var(--primary); color:white; opacity:0; }
    .fab-st.show { opacity:1; }
    .swiper { border-radius: 20px; margin-bottom: 20px; }
    .swiper-slide img { width:100%; height:200px; object-fit: cover; border-radius: 20px; }
    @media (max-width:768px) { .hide-mobile { display:none; } }
  </style>
</head>
<body>

<div id="loader" style="position:fixed; inset:0; background:var(--primary); z-index:9999; display:flex; align-items:center; justify-content:center; flex-direction:column; transition:0.5s">
  <img src="logo.jpg" style="width:80px; border-radius:50%; border:3px solid var(--gold)">
  <div class="spinner-border text-warning mt-3"></div>
</div>

<button class="fab-th" id="darkModeToggle"><i class="fas fa-moon"></i></button>
<button class="fab-st" id="goTop"><i class="fas fa-chevron-up"></i></button>

<header class="header-gold py-2">
  <div class="container">
    <div class="row align-items-center text-center text-md-end">
      <div class="col-md-auto"><img src="logo.jpg" class="school-logo" onerror="this.src='https://placehold.co/55x55'"></div>
      <div class="col"><span class="badge bg-warning text-dark">إدارة الفشن التعليمية</span><h1 class="text-white fs-5 fw-bold mt-1">مدرسة سعد بن أبي وقاص الرسمية للغات</h1><p class="text-white-50 small">المنصة التعليمية المتكاملة</p></div>
    </div>
  </div>
</header>

<div class="ticker-container"><div class="ticker-track" id="tickerTrack"></div></div>

<div class="container my-4">
  <div class="row g-4">
    <div class="col-lg-3 hide-mobile">
      <div class="glass-card">
        <button class="nav-btn" onclick="loadSection('home')"><i class="fas fa-home ms-2"></i> الرئيسية</button>
        <button class="nav-btn" onclick="loadSection('posts')"><i class="fas fa-newspaper ms-2"></i> الأخبار والمنشورات</button>
        <button class="nav-btn" onclick="loadSection('students')"><i class="fas fa-user-graduate ms-2"></i> شئون الطلاب</button>
        <button class="nav-btn" onclick="loadSection('activities')"><i class="fas fa-futbol ms-2"></i> الأنشطة</button>
        <button class="nav-btn" onclick="openAdminPanel()"><i class="fas fa-lock ms-2"></i> <span id="adminBtnText">لوحة الإدارة</span></button>
      </div>
      <div class="glass-card"><h6 class="fw-bold mb-3"><i class="fas fa-chart-line text-warning"></i> إحصائيات المدرسة</h6>
        <div class="d-flex justify-content-between"><span>الطلاب</span><span id="statStudents" style="cursor:pointer; font-weight:bold; color:var(--gold)">0</span></div>
        <div class="d-flex justify-content-between mt-2"><span>المعلمون</span><span id="statTeachers" style="cursor:pointer; font-weight:bold; color:var(--gold)">0</span></div>
        <div class="d-flex justify-content-between mt-2"><span>الأنشطة</span><span id="statActivities" style="cursor:pointer; font-weight:bold; color:var(--gold)">0</span></div>
      </div>
    </div>

    <div class="col-lg-9">
      <div class="swiper mainSlider mb-3"><div class="swiper-wrapper" id="heroSlider"></div><div class="swiper-pagination"></div><div class="swiper-button-next"></div><div class="swiper-button-prev"></div></div>
      <div id="dynamicContent"><div class="text-center p-5"><i class="fas fa-spinner fa-spin fa-2x text-warning"></i></div></div>
    </div>
  </div>
</div>

<footer class="bg-dark text-white-50 py-3 text-center"><small>© 2026 منصة سعد بن أبي وقاص | تطوير أحمد صابر</small></footer>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
  // ==================== تكوين Firebase و Cloudinary ====================
  const firebaseConfig = {
    apiKey: "AIzaSyC79JwFiDucsph3T8PTKntbk_VE1ANFTxg",
    authDomain: "saad-school-portal.firebaseapp.com",
    databaseURL: "https://saad-school-portal-default-rtdb.firebaseio.com",
    projectId: "saad-school-portal",
    storageBucket: "saad-school-portal.firebasestorage.app",
    messagingSenderId: "1085838136773",
    appId: "1:1085838136773:web:0d200edd01bd12fb0a27ac"
  };
  const ADMIN_SECRET = "QWJ1c2FiZXIyMTc4"; // Abusaber2178
  const CLOUD_NAME = "dyo4ff7ha";
  const UPLOAD_PRESET = "school_raw";
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let isAdmin = false;
  let currentSection = "home";
  let currentActivityId = null;
  let swiperHero = null;

  // دوال مساعدة
  function toast(msg, type="info"){ let d=document.createElement("div"); d.className=`alert alert-${type} position-fixed top-0 start-50 translate-middle-x mt-3 shadow`; d.innerText=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),2500); }
  function formatDate(ts){ return new Date(ts).toLocaleString("ar-EG"); }
  function escapeHtml(s){ if(!s) return ""; return s.replace(/[&<>]/g, m=> m==='&'?'&amp;': m==='<'?'&lt;': '&gt;'); }
  function getYoutubeId(url){ let m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?#]+)/); return m ? m[1] : null; }

  function generateMediaHtml(url){
    if(!url) return "";
    let yt = getYoutubeId(url);
    if(yt) return `<div class="media-wrapper"><iframe src="https://www.youtube.com/embed/${yt}" allowfullscreen></iframe></div>`;
    if(url.match(/\.(jpg|jpeg|png|gif|webp)(\?|$)/i)) return `<div class="media-wrapper"><img src="${url}" onclick="openImage('${url}')"></div>`;
    if(url.match(/\.(mp4|mov|webm)(\?|$)/i)) return `<div class="media-wrapper"><video controls src="${url}"></video></div>`;
    if(url.match(/\.pdf(\?|$)/i)) return `<div class="media-wrapper"><iframe src="https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true"></iframe></div>`;
    return `<div class="media-wrapper"><a href="${url}" target="_blank" class="btn btn-outline-primary w-100">فتح الرابط</a></div>`;
  }

  async function uploadFile(file){
    let fd = new FormData(); fd.append("file", file); fd.append("upload_preset", UPLOAD_PRESET);
    let res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, { method: "POST", body: fd });
    let data = await res.json(); return data.secure_url;
  }

  // ==================== الإحصائيات (قابلة للتعديل للمدير) ====================
  function loadStats(){
    db.ref("school_stats").on("value", snap=>{
      let s = snap.val() || { studentsCount: 1250, teachersCount: 85, activitiesCount: 0 };
      document.getElementById("statStudents").innerText = s.studentsCount;
      document.getElementById("statTeachers").innerText = s.teachersCount;
      document.getElementById("statActivities").innerText = s.activitiesCount;
    });
  }
  window.editStat = async (field)=>{
    if(!isAdmin) return toast("خاص بالإدارة","warning");
    let current = document.getElementById(field==="studentsCount"?"statStudents":field==="teachersCount"?"statTeachers":"statActivities").innerText;
    let { value } = await Swal.fire({ title: "تعديل القيمة", input: "number", inputValue: current, showCancelButton: true });
    if(value && !isNaN(parseInt(value))) await db.ref(`school_stats/${field}`).set(parseInt(value));
  };
  document.getElementById("statStudents")?.addEventListener("click",()=>editStat("studentsCount"));
  document.getElementById("statTeachers")?.addEventListener("click",()=>editStat("teachersCount"));
  document.getElementById("statActivities")?.addEventListener("click",()=>editStat("activitiesCount"));

  // ==================== شريط الأخبار (إدارة كاملة للمدير) ====================
  function loadTicker(){
    db.ref("ticker_news").orderByChild("timestamp").once("value", snap=>{
      let arr = []; snap.forEach(c=>arr.unshift(c.val().text));
      if(arr.length===0) arr=["أهلاً بكم في المنصة","نتائج الامتحانات متاحة","فعاليات الأنشطة مستمرة"];
      let track = document.getElementById("tickerTrack"); track.innerHTML="";
      let repeated = [...arr, ...arr];
      repeated.forEach(t=>{ let span=document.createElement("span"); span.className="ticker-item"; span.innerHTML=`<i class="fas fa-star-of-life"></i> ${t}`; track.appendChild(span); });
    });
  }
  async function addTickerItem(){
    if(!isAdmin) return;
    let { value } = await Swal.fire({ title: "إضافة خبر جديد", input: "text", inputPlaceholder: "نص الخبر", showCancelButton: true });
    if(value) await db.ref("ticker_news").push({ text: value, timestamp: Date.now() }).then(()=>loadTicker());
  }
  async function deleteTickerItem(key){
    if(!isAdmin) return;
    await db.ref(`ticker_news/${key}`).remove();
    loadTicker();
  }
  // زر إدارة التيكر يظهر في واجهة المدير
  function renderTickerAdmin(){
    if(!isAdmin) return "";
    return `<div class="mt-2 d-flex gap-2"><button class="btn btn-sm btn-gold" onclick="addTickerItem()"><i class="fas fa-plus"></i> إضافة خبر</button></div>`;
  }

  // ==================== السلايدر (من الصور المرفوعة في الأنشطة) ====================
  async function loadHeroSlider(){
    let images = [];
    let acts = await db.ref("activities_list").once("value");
    for(let act of acts.val() ? Object.values(acts.val()) : []){
      let posts = await db.ref(`activities/${act.id}/posts`).limitToFirst(5).once("value");
      posts.forEach(p=>{ if(p.val().mediaUrl && p.val().mediaUrl.match(/\.(jpg|jpeg|png|gif|webp)/i)) images.push(p.val().mediaUrl); });
    }
    if(images.length===0) images = ["https://picsum.photos/id/20/800/300","https://picsum.photos/id/100/800/300","https://picsum.photos/id/180/800/300"];
    let slidesHtml = images.map(img=>`<div class="swiper-slide"><img src="${img}" style="height:200px; object-fit:cover; width:100%; border-radius:20px"></div>`).join("");
    document.getElementById("heroSlider").innerHTML = slidesHtml;
    if(swiperHero) swiperHero.destroy(true,true);
    swiperHero = new Swiper(".mainSlider", { loop: true, autoplay: { delay: 4000 }, pagination: { el: ".swiper-pagination" }, navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" } });
  }

  // ==================== عرض المنشورات (عامة أو داخل النشاط) ====================
  async function renderPostCard(post, postId, showPublisher=true, isActivity=false){
    let userId = localStorage.getItem("userId") || "u"+Math.random(); if(!localStorage.getItem("userId")) localStorage.setItem("userId",userId);
    let liked = post.likes && post.likes[userId];
    let likesCount = post.likes ? Object.keys(post.likes).length : 0;
    let commentsHtml = "";
    if(post.comments){
      Object.values(post.comments).forEach(c=>{
        commentsHtml += `<div class="border-bottom pb-1 mb-1"><strong>${escapeHtml(c.author)}</strong> <small class="text-muted">${c.date||""}</small><p class="mb-0">${escapeHtml(c.text)}</p>${isAdmin ? `<button class="btn btn-sm btn-link text-danger p-0 float-start" onclick="deleteComment('${postId}','${c.id}')"><i class="fas fa-trash-alt"></i></button>` : ""}</div>`;
      });
    }
    let publisherHtml = "";
    if(showPublisher){
      publisherHtml = `<div class="d-flex gap-3"><div class="post-avatar">${post.publisherAvatar ? `<img src="${post.publisherAvatar}">` : `<i class="fas fa-user-tie"></i>`}</div><div><div class="fw-bold">${escapeHtml(post.publisherName||"إدارة المدرسة")}</div><div class="small text-muted">${post.publisherRole || ""}</div><div class="small text-muted">${formatDate(post.timestamp)}</div></div>${isAdmin ? `<button class="btn btn-sm btn-link text-danger ms-auto" onclick="deletePost('${postId}', ${isActivity}, '${currentActivityId||''}')"><i class="fas fa-trash-alt"></i></button>` : ""}</div>`;
    } else {
      publisherHtml = `<div class="d-flex justify-content-between"><div><div class="fw-bold">${escapeHtml(post.author||"إدارة المدرسة")}</div><div class="small text-muted">${formatDate(post.timestamp)}</div></div>${isAdmin ? `<button class="btn btn-sm btn-link text-danger" onclick="deletePost('${postId}', false, '')"><i class="fas fa-trash-alt"></i></button>` : ""}</div>`;
    }
    return `<div class="post-card" data-id="${postId}">
      <div class="mb-2">${publisherHtml}</div>
      <div class="post-content">${escapeHtml(post.content)}</div>
      ${post.mediaUrl ? generateMediaHtml(post.mediaUrl) : ""}
      <div class="d-flex gap-3 mt-2 small text-muted"><span><i class="fas fa-thumbs-up"></i> ${likesCount}</span><span><i class="fas fa-comment"></i> ${post.comments ? Object.keys(post.comments).length : 0}</span></div>
      <div class="d-flex gap-2 mt-2">
        <button class="btn btn-sm ${liked ? 'btn-primary' : 'btn-outline-secondary'} likeBtn" data-id="${postId}" data-activity="${isActivity}" data-actid="${currentActivityId||''}"><i class="fas fa-thumbs-up"></i> أعجبني</button>
        <button class="btn btn-sm btn-outline-secondary commentToggle" data-id="${postId}"><i class="fas fa-comment"></i> تعليق</button>
        <button class="btn btn-sm btn-outline-success shareWA" data-content="${escapeHtml(post.content)}"><i class="fab fa-whatsapp"></i> مشاركة</button>
      </div>
      <div id="comments-${postId}" class="mt-2" style="display:none">
        <div>${commentsHtml}</div>
        <div class="input-group mt-2"><input type="text" class="form-control form-control-sm newComment" data-id="${postId}" placeholder="اكتب تعليقاً..."><button class="btn btn-sm btn-gold submitComment" data-id="${postId}" data-activity="${isActivity}" data-actid="${currentActivityId||''}">نشر</button></div>
      </div>
    </div>`;
  }

  // المنشورات العامة
  async function loadGeneralPosts(){
    let container = document.getElementById("dynamicContent");
    container.innerHTML = `<div class="text-center"><i class="fas fa-spinner fa-spin"></i></div>`;
    let snap = await db.ref("posts").orderByChild("timestamp").once("value");
    let posts = []; snap.forEach(p=>posts.push({ id:p.key, ...p.val() }));
    posts.sort((a,b)=>b.timestamp - a.timestamp);
    let html = `<div class="d-flex justify-content-between"><h4><i class="fas fa-newspaper text-warning"></i> المنشورات العامة</h4>${isAdmin ? `<button class="btn btn-gold btn-sm" onclick="showCreatePostModal('general')">+ منشور جديد</button>` : ""}</div>`;
    for(let p of posts) html += await renderPostCard(p, p.id, false);
    container.innerHTML = html;
    attachPostEvents(false);
  }

  // منشورات النشاط
  async function loadActivityPosts(actId){
    let container = document.getElementById("activityPostsContainer");
    if(!container) return;
    container.innerHTML = `<div class="text-center"><i class="fas fa-spinner fa-spin"></i></div>`;
    let snap = await db.ref(`activities/${actId}/posts`).orderByChild("timestamp").once("value");
    let posts = []; snap.forEach(p=>posts.push({ id:p.key, ...p.val() }));
    posts.sort((a,b)=>b.timestamp - a.timestamp);
    if(posts.length===0){ container.innerHTML = "<div class='alert alert-secondary'>لا توجد منشورات في هذا النشاط بعد. أضف منشوراً!</div>"; return; }
    let html = "";
    for(let p of posts) html += await renderPostCard(p, p.id, true, true);
    container.innerHTML = html;
    attachPostEvents(true, actId);
  }

  function attachPostEvents(isActivity=false, actId=""){
    // الإعجاب
    document.querySelectorAll(".likeBtn").forEach(btn=>{
      btn.onclick = async ()=>{
        let id = btn.dataset.id;
        let userId = localStorage.getItem("userId");
        let refPath = isActivity ? `activities/${actId}/posts/${id}/likes/${userId}` : `posts/${id}/likes/${userId}`;
        let ref = db.ref(refPath);
        let snap = await ref.once("value");
        if(snap.exists()) ref.remove();
        else ref.set(true);
        if(isActivity) loadActivityPosts(actId);
        else loadGeneralPosts();
      };
    });
    // إظهار/إخفاء التعليقات
    document.querySelectorAll(".commentToggle").forEach(btn=>{
      btn.onclick = ()=>{
        let id = btn.dataset.id;
        let div = document.getElementById(`comments-${id}`);
        if(div) div.style.display = div.style.display==="none"?"block":"none";
      };
    });
    // إضافة تعليق
    document.querySelectorAll(".submitComment").forEach(btn=>{
      btn.onclick = async ()=>{
        let id = btn.dataset.id;
        let inp = document.querySelector(`.newComment[data-id="${id}"]`);
        let txt = inp.value.trim();
        if(!txt) return;
        let comment = { id: Date.now().toString(), author: isAdmin ? "إدارة المدرسة" : "زائر", text: txt, date: formatDate(Date.now()) };
        let refPath = isActivity ? `activities/${actId}/posts/${id}/comments` : `posts/${id}/comments`;
        await db.ref(refPath).push(comment);
        inp.value = "";
        toast("تم التعليق");
        if(isActivity) loadActivityPosts(actId);
        else loadGeneralPosts();
      };
    });
    // مشاركة واتساب
    document.querySelectorAll(".shareWA").forEach(btn=>{
      btn.onclick = ()=> window.open(`https://wa.me/?text=${encodeURIComponent(btn.dataset.content)}`);
    });
  }

  // حذف المنشور (للمدير)
  window.deletePost = async (postId, isActivity, actId)=>{
    if(!isAdmin) return;
    if(confirm("حذف المنشور نهائياً؟")){
      if(isActivity) await db.ref(`activities/${actId}/posts/${postId}`).remove();
      else await db.ref(`posts/${postId}`).remove();
      toast("تم حذف المنشور");
      if(isActivity) loadActivityPosts(actId);
      else loadGeneralPosts();
    }
  };
  window.deleteComment = async (postId, commentId)=>{
    if(!isAdmin) return;
    let commentsRef = currentActivityId ? db.ref(`activities/${currentActivityId}/posts/${postId}/comments`) : db.ref(`posts/${postId}/comments`);
    let snap = await commentsRef.once("value");
    snap.forEach(c=>{ if(c.val().id === commentId) c.ref.remove(); });
    toast("تم حذف التعليق");
    if(currentActivityId) loadActivityPosts(currentActivityId);
    else loadGeneralPosts();
  };

  // ==================== إدارة الأنشطة ====================
  async function loadActivitiesList(){
    let snap = await db.ref("activities_list").orderByChild("name").once("value");
    let acts = []; snap.forEach(a=>acts.push({ id:a.key, ...a.val() }));
    let html = `<div class="d-flex justify-content-between"><h4><i class="fas fa-futbol text-warning"></i> الأنشطة المدرسية</h4>${isAdmin ? `<button class="btn btn-gold btn-sm" onclick="createNewActivity()">+ نشاط جديد</button>` : ""}</div><div class="row g-3 mt-2">`;
    if(acts.length===0) html += `<div class="col-12"><div class="alert alert-info">لا توجد أنشطة بعد. أضف نشاطاً الآن!</div></div>`;
    for(let act of acts){
      html += `<div class="col-md-6"><div class="card p-3 h-100"><div class="d-flex justify-content-between"><h5>${escapeHtml(act.name)}</h5>${isAdmin ? `<button class="btn btn-sm btn-outline-danger" onclick="deleteActivity('${act.id}')"><i class="fas fa-trash"></i></button>` : ""}</div><p>${escapeHtml(act.description||"")}</p><button class="btn btn-gold btn-sm mt-2" onclick="viewActivity('${act.id}','${escapeHtml(act.name)}')">فتح النشاط</button></div></div>`;
    }
    html += `</div><div>${renderTickerAdmin()}</div>`;
    document.getElementById("dynamicContent").innerHTML = html;
  }

  window.createNewActivity = async () => {
    if(!isAdmin) return;
    let { value: form } = await Swal.fire({ title: "نشاط جديد", html: `<input id="actName" class="swal2-input" placeholder="اسم النشاط (مثال: التربية الفنية)"><textarea id="actDesc" class="swal2-textarea" placeholder="وصف النشاط (اختياري)"></textarea>`, showCancelButton: true });
    if(form){
      let name = document.getElementById("actName").value;
      let desc = document.getElementById("actDesc").value;
      if(name){
        let newRef = db.ref("activities_list").push();
        await newRef.set({ name, description: desc, timestamp: Date.now() });
        // تحديث عدد الأنشطة في الإحصائيات
        let countSnap = await db.ref("activities_list").once("value");
        await db.ref("school_stats/activitiesCount").set(countSnap.numChildren());
        loadActivitiesList();
      }
    }
  };
  window.deleteActivity = async (id) => {
    if(!isAdmin) return;
    if(confirm("حذف النشاط سيحذف جميع منشوراته نهائياً!")){
      await db.ref(`activities_list/${id}`).remove();
      await db.ref(`activities/${id}`).remove();
      let countSnap = await db.ref("activities_list").once("value");
      await db.ref("school_stats/activitiesCount").set(countSnap.numChildren());
      loadActivitiesList();
    }
  };
  async function viewActivity(actId, actName){
    currentActivityId = actId;
    let container = document.getElementById("dynamicContent");
    container.innerHTML = `<div class="d-flex justify-content-between"><h4><i class="fas fa-palette text-warning"></i> نشاط: ${escapeHtml(actName)}</h4>${isAdmin ? `<button class="btn btn-gold btn-sm" onclick="showCreatePostModal('activity','${actId}')">+ منشور جديد</button>` : ""}</div><div id="activityPostsContainer">جاري التحميل...</div><button class="btn btn-secondary mt-3" onclick="loadActivitiesList()"><i class="fas fa-arrow-right"></i> العودة للأنشطة</button>`;
    loadActivityPosts(actId);
  }

  // ==================== نموذج إنشاء منشور (للمدير) ====================
  window.showCreatePostModal = async (type, activityId=null) => {
    if(!isAdmin) return toast("خاص بالإدارة","warning");
    Swal.fire({
      title: "منشور جديد",
      html: `<input id="pubName" class="swal2-input" placeholder="اسم الناشر"><input id="pubRole" class="swal2-input" placeholder="الوظيفة (مثال: معلم أول لغة عربية)"><div><input type="file" id="pubAvatarFile" accept="image/*" style="width:45%"> أو <input id="pubAvatarUrl" class="swal2-input" style="width:45%" placeholder="رابط صورة الناشر"></div><textarea id="postContent" class="swal2-textarea" placeholder="محتوى المنشور"></textarea><input id="postMedia" class="swal2-input" placeholder="رابط ميديا (يوتيوب، صورة، PDF...)" ><input type="file" id="postFile" accept="image/*,video/*">`,
      showCancelButton: true,
      preConfirm: async () => {
        let name = document.getElementById("pubName").value;
        let role = document.getElementById("pubRole").value;
        let avatarUrl = document.getElementById("pubAvatarUrl").value;
        let file = document.getElementById("pubAvatarFile").files[0];
        if(file){ toast("جاري رفع صورة الناشر"); avatarUrl = await uploadFile(file); }
        let content = document.getElementById("postContent").value;
        let mediaUrl = document.getElementById("postMedia").value;
        let mediaFile = document.getElementById("postFile").files[0];
        if(mediaFile){ toast("جاري رفع الملف"); mediaUrl = await uploadFile(mediaFile); }
        return { publisherName: name, publisherRole: role, publisherAvatar: avatarUrl, content, mediaUrl };
      }
    }).then(async res=>{
      if(res.isConfirmed){
        let post = { ...res.value, timestamp: Date.now(), likes: {}, comments: {}, author: "إدارة المدرسة" };
        if(type === "general") await db.ref("posts").push(post);
        else if(type === "activity") await db.ref(`activities/${activityId}/posts`).push(post);
        toast("تم النشر");
        if(type==="general") loadGeneralPosts();
        else viewActivity(activityId, (await db.ref(`activities_list/${activityId}`).once("value")).val().name); // إعادة تحميل النشاط
      }
    });
  };

  // ==================== شئون الطلاب (نتائج + رفع JSON) ====================
  async function loadStudentsSection(){
    let html = `<h4><i class="fas fa-graduation-cap"></i> استعلام النتائج</h4><div class="row g-2"><div class="col-md-6"><select id="gradeSelect" class="form-select"><option value="p6">السادس الابتدائي</option><option value="p5">الخامس</option><option value="p4">الرابع</option><option value="p3">الثالث</option></select></div><div class="col-md-6"><input id="seatNum" class="form-control" placeholder="رقم الجلوس"></div></div><button class="btn-gold mt-3 w-100" onclick="searchResult()">استعلام</button><div id="resultCard" class="mt-4"></div>${isAdmin ? `<hr><h6>رفع نتائج JSON</h6><input type="file" id="jsonFile" accept=".json" class="form-control"><button class="btn btn-sm btn-secondary mt-2" onclick="uploadResults()">رفع</button><div id="jsonMsg"></div>` : ""}</div>`;
    document.getElementById("dynamicContent").innerHTML = html;
  }
  window.searchResult = async () => {
    let grade = document.getElementById("gradeSelect").value, seat = document.getElementById("seatNum").value; if(!seat){ toast("أدخل رقم الجلوس"); return; }
    let snap = await db.ref(`results/${grade}/${seat}`).once("value"); let data = snap.val();
    if(!data){ document.getElementById("resultCard").innerHTML = "<div class='alert alert-danger'>النتيجة غير موجودة</div>"; return; }
    let subjectsHtml = ""; for(let [sub,score] of Object.entries(data.subjects||{})) subjectsHtml += `<div class="d-flex justify-content-between border-bottom py-1"><span>${sub}</span><strong>${score}</strong></div>`;
    document.getElementById("resultCard").innerHTML = `<div class="p-3 border border-warning rounded"><h4>${data.name}</h4><hr>${subjectsHtml}<hr><div>المجموع: ${data.total} | النسبة: ${data.percentage}% | التقدير: ${data.grade}</div><div class="d-flex gap-2 mt-3"><button class="btn btn-gold" onclick="printCertificate(this)">طباعة PDF</button><button class="btn btn-success" onclick="shareWhatsApp('${data.name}',${data.total})">مشاركة</button></div></div>`;
  };
  window.printCertificate = async (btn) => { let element = btn.closest(".p-3.border.border-warning.rounded"); if(!element) return; let canvas = await html2canvas(element, { scale:2 }); let imgData = canvas.toDataURL("image/png"); let { jsPDF } = window.jspdf; let pdf = new jsPDF("p","mm","a4"); let w = 190; let h = canvas.height * w / canvas.width; pdf.addImage(imgData, "PNG", 10, 10, w, h); pdf.save("certificate.pdf"); toast("تم التحميل"); };
  window.shareWhatsApp = (name, total) => window.open(`https://wa.me/?text=${encodeURIComponent(`نتيجة الطالب ${name}: ${total} درجة`)}`);
  window.uploadResults = () => { if(!isAdmin) return; let file = document.getElementById("jsonFile").files[0]; if(!file) return; let reader = new FileReader(); reader.onload = e=>{ let data = JSON.parse(e.target.result); let updates = {}; for(let grade in data) for(let seat in data[grade]) updates[`results/${grade}/${seat}`] = data[grade][seat]; db.ref().update(updates).then(()=>toast("تم رفع النتائج")); }; reader.readAsText(file); };

  // ==================== التنقل ولوحة الإدارة ====================
  window.loadSection = (section) => {
    currentSection = section;
    if(section === "home") loadGeneralPosts();
    else if(section === "posts") loadGeneralPosts();
    else if(section === "students") loadStudentsSection();
    else if(section === "activities") loadActivitiesList();
  };
  window.openAdminPanel = () => {
    if(isAdmin){ isAdmin=false; document.getElementById("adminBtnText").innerText="لوحة الإدارة"; toast("تم تسجيل الخروج"); loadSection(currentSection); return; }
    Swal.fire({ title: "دخول الإدارة", input: "password", showCancelButton: true }).then(res=>{
      if(res.isConfirmed && btoa(res.value) === ADMIN_SECRET){
        isAdmin = true; document.getElementById("adminBtnText").innerText="تسجيل الخروج";
        toast("مرحباً مدير المدرسة"); loadSection(currentSection);
      } else toast("كلمة سر خاطئة","error");
    });
  };

  // ==================== بدء التشغيل ====================
  function init(){
    loadStats(); loadTicker(); loadGeneralPosts(); loadHeroSlider();
    document.getElementById("goTop").onclick = () => window.scrollTo({ top:0, behavior:"smooth" });
    window.onscroll = () => document.getElementById("goTop").classList.toggle("show", window.scrollY>200);
    document.getElementById("darkModeToggle").onclick = () => { document.body.classList.toggle("dark"); localStorage.setItem("theme", document.body.classList.contains("dark")?"dark":"light"); };
    setTimeout(()=>{ let ld=document.getElementById("loader"); if(ld) ld.style.opacity="0"; setTimeout(()=>ld?.remove(),500); }, 800);
  }
  init();
</script>
</body>
</html>
